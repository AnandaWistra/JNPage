<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List - Tugas JS | JNPage</title>

    <!-- font & tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 flex flex-col min-h-screen antialiased">

    <!-- header (otomatis dari script.js) -->
    <header id="app-header"></header>

    <main class="flex-grow max-w-2xl mx-auto px-4 py-12 w-full relative z-10 pt-28">
        
        <!-- Judul -->
        <div class="mb-10 text-center">
            <span class="inline-block px-3 py-1 mb-3 text-xs font-bold text-indigo-600 bg-indigo-100 dark:bg-indigo-900/40 rounded-full">Tugas Javascript</span>
            <h2 class="text-3xl md:text-4xl font-extrabold mb-4">Catatan <span class="text-indigo-500">Tugas</span></h2>
            <p class="text-gray-600 dark:text-gray-400 text-sm">Aplikasi To-Do List sederhana menggunakan Vanilla JS & Local Storage.</p>
        </div>

        <!-- Wadah Aplikasi -->
        <div class="bg-white dark:bg-gray-800 rounded-3xl p-6 shadow-sm border border-gray-200 dark:border-gray-700">
            
            <!-- Input Form -->
            <form id="todoForm" class="flex gap-2 mb-6">
                <input type="text" id="todoInput" placeholder="Tambahkan tugas baru..." required
                    class="flex-grow px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                <button type="submit" class="px-6 py-3 bg-indigo-500 hover:bg-indigo-600 text-white font-bold rounded-xl transition-all shadow-sm active:scale-95">
                    Tambah
                </button>
            </form>

            <!-- List Catatan -->
            <ul id="todoList" class="space-y-3">
                <!-- Data akan dimunculkan oleh JS di sini -->
            </ul>
        </div>
    </main>

    <!-- footer (otomatis dari script.js) -->
    <footer id="app-footer" class="bg-white/70 dark:bg-gray-800/70 border-t border-gray-200 dark:border-gray-700 py-6 mt-auto relative z-10"></footer>
    
    <!-- Script Eksekusi Navbar & Footer -->
    <script src="assets/js/script.js"></script>

    <!-- Logika Javascript To-Do List yang Sangat Simpel -->
    <script>
        const todoForm = document.getElementById('todoForm');
        const todoInput = document.getElementById('todoInput');
        const todoList = document.getElementById('todoList');

        // Ambil data dari penyimpanan browser (Local Storage), kalau kosong buat array baru []
        let todos = JSON.parse(localStorage.getItem('JNPage_Todos')) || [];

        // Fungsi untuk menampilkan data ke layar
        function renderTodos() {
            todoList.innerHTML = ''; // Kosongkan list dulu
            
            todos.forEach((todo, index) => {
                const li = document.createElement('li');
                li.className = `flex justify-between items-center p-4 rounded-xl border ${todo.completed ? 'bg-gray-100 dark:bg-gray-900 border-gray-100 dark:border-gray-800' : 'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700'} transition-all`;
                
                li.innerHTML = `
                    <div class="flex items-center gap-3 cursor-pointer" onclick="toggleTodo(${index})">
                        <input type="checkbox" ${todo.completed ? 'checked' : ''} class="w-5 h-5 text-indigo-500 cursor-pointer">
                        <span class="${todo.completed ? 'line-through text-gray-400' : 'text-gray-700 dark:text-gray-200'} transition-all font-medium">${todo.text}</span>
                    </div>
                    <button onclick="deleteTodo(${index})" class="text-red-500 hover:text-red-700 p-2 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                `;
                todoList.appendChild(li);
            });

            // Simpan perubahan ke Local Storage
            localStorage.setItem('JNPage_Todos', JSON.stringify(todos));
        }

        // Fungsi saat tombol Tambah diklik
        todoForm.addEventListener('submit', function(e) {
            e.preventDefault(); // Biar web gak ter-refresh
            todos.push({ text: todoInput.value, completed: false });
            todoInput.value = ''; // Kosongkan form
            renderTodos();
        });

        // Fungsi untuk mencoret (Selesai)
        function toggleTodo(index) {
            todos[index].completed = !todos[index].completed;
            renderTodos();
        }

        // Fungsi untuk hapus catatan
        function deleteTodo(index) {
            todos.splice(index, 1);
            renderTodos();
        }

        // Jalankan saat web pertama kali dibuka
        renderTodos();
    </script>
</body>
</html>
