<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio - Ananda Wistra</title>
    
    <!-- Mengambil Font 'Plus Jakarta Sans' dari Google Fonts agar rapi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & PENGATURAN LAYAR PENUH --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh; /* Membuat tinggi layar penuh */
            display: flex;
            justify-content: center; /* Rata tengah horizontal */
            align-items: center; /* Rata tengah vertikal */
            background-color: #e2eaf4; /* Warna background biru muda keabu-abuan */
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* --- EFEK ECLIPSE TEXT --- */
        .eclipse-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        /* Memastikan kedua teks menumpuk dengan presisi */
        .eclipse-wrapper {
            position: relative;
            display: inline-block;
        }

        /* Pengaturan dasar bentuk font (berlaku untuk kedua teks) */
        .eclipse-text {
            font-size: 64px; /* Ukuran font besar */
            font-weight: 400; /* Ketebalan font */
            margin: 0;
            padding: 20px 60px; /* Memberi ruang ekstra di kiri-kanan agar lingkaran tidak terpotong */
            white-space: nowrap; /* Mencegah teks turun ke baris baru */
            letter-spacing: 2px; /* Jarak antar huruf */
        }

        /* Tampilan Lapisan Bawah (Teks Biru Gelap di luar lingkaran) */
        .dark-text {
            color: #2b354d; /* Warna teks utama biru gelap */
        }

        /* Tampilan Lapisan Atas (Lingkaran Coklat Gelap & Teks Kuning) */
        .light-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: #dfcd9f; /* Warna teks kuning/tan di dalam lingkaran */
            background-color: #1e1912; /* Warna coklat gelap untuk background lingkaran */
            
            /* KUNCI EFEK: Memotong div lapisan atas menjadi bentuk lingkaran */
            clip-path: circle(70px at 0% 50%);
            
            /* Menjalankan animasi bergerak ke kiri-kanan bolak-balik tanpa henti */
            animation: eclipseMovement 4s infinite alternate ease-in-out;
        }

        /* Animasi Pergerakan Lingkaran */
        @keyframes eclipseMovement {
            0% {
                clip-path: circle(70px at 0% 50%); /* Mulai dari paling kiri */
            }
            100% {
                clip-path: circle(70px at 100% 50%); /* Mentok di paling kanan */
            }
        }

        /* --- RESPONSIF UNTUK LAYAR HP --- */
        @media (max-width: 768px) {
            .eclipse-text {
                font-size: 32px; /* Ukuran font mengecil di HP */
                padding: 15px 40px;
            }
            .light-text {
                clip-path: circle(40px at 0% 50%); /* Ukuran lingkaran mengecil di HP */
            }
            @keyframes eclipseMovement {
                0% { clip-path: circle(40px at 0% 50%); }
                100% { clip-path: circle(40px at 100% 50%); }
            }
        }
    </style>
</head>
<body>

    <!-- Kontainer Efek Eclipse Perkenalan -->
    <div class="eclipse-container">
        <div class="eclipse-wrapper">
            <!-- Lapisan Bawah: Teks utama yang berwarna biru gelap -->
            <h1 class="eclipse-text dark-text">Halo, nama saya Ananda Wistra</h1>
            
            <!-- Lapisan Atas: Teks yang akan muncul di dalam lingkaran bergerak -->
            <h1 class="eclipse-text light-text">Halo, nama saya Ananda Wistra</h1>
        </div>
    </div>

</body>
</html>
